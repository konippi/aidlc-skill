name: Link Check

on:
  pull_request:
    paths:
      - "**/*.md"
  push:
    branches: [main]
    paths:
      - "**/*.md"
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.7.0
        with:
          args: >-
            --no-progress
            --verbose
            --accept 200,204,206,301,302,403,429
            --exclude-path node_modules
            --exclude-path .git
            './**/*.md'
          fail: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find existing open link-rot issue
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        id: last-issue
        uses: micalevisk/last-issue-action@0d40124cc99ac8601c2516007f0c98ef3d27537b # v2.3.0
        with:
          state: open
          labels: link-rot

      - name: Create or update issue on broken links
        if: >-
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "Link Checker Report"
          content-filepath: ./lychee/out.md
          issue-number: ${{ steps.last-issue.outputs.issue-number }}
          labels: |
            link-rot
            automated

      - name: Close issue when links are fixed
        if: >-
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
          && steps.lychee.outputs.exit_code == 0
          && steps.last-issue.outputs.has-found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue close "${{ steps.last-issue.outputs.issue-number }}" --comment "Automated link check passed — closing."
