name: Validate SKILL.md

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/validate.yml"
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@ce4853d43830c74c1753b39f3cf40f71c2031eb9 # v23.0.0

      - name: Validate SKILL.md
        run: |
          set -euo pipefail
          head -1 SKILL.md | grep -q '^---$' || { echo "::error::missing frontmatter"; exit 1; }
          FM=$(sed -n '2,/^---$/p' SKILL.md | sed '$d')
          echo "$FM" | grep -q '^name:' || { echo "::error::\`name\` field missing"; exit 1; }
          echo "$FM" | grep -q '^description:' || { echo "::error::\`description\` field missing"; exit 1; }
          LINES=$(wc -l < SKILL.md)
          [ "$LINES" -le 500 ] || { echo "::error::SKILL.md exceeds 500 lines ($LINES)"; exit 1; }
          echo "OK: frontmatter valid, $LINES lines"
