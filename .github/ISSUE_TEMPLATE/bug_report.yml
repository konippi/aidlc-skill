name: Bug Report
description: Report a problem with aidlc-skill
labels: [bug]
body:
  - type: input
    id: agent
    attributes:
      label: Agent
      description: Which agent were you using? (e.g., Claude Code, Kiro CLI, Codex, Cursor, Gemini CLI)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: workflow-state
    attributes:
      label: Relevant aidlc-docs state (optional)
      description: If the issue surfaced mid-workflow, paste the relevant portion of `aidlc-docs/aidlc-state.md` or `aidlc-docs/audit.md`.
      render: markdown
    validations:
      required: false
